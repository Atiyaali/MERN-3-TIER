name: Docker Image CI

on:
 push:
  branches: ["main"]
 pull_request:
  branches: ["main"]
jobs:
  Docker:
   runs-on: ubuntu-latest
   steps:
     - name: code
       uses: actions/checkout@v3
     - name: docker login
       uses: docker/login-action@v4
       with:
         username: ${{secrets.DOCKER_USERNAME}}
         password: ${{secrets.DOCKER_PASSWORD}}
     - name: frontend image build
       run: docker build \
            -t atiyadocker/mern-frontend:${{github.sha}} \
            -t atiyadocker/mern-frontend:latest \
            ./frontend
     - name: backend image build
       run: docker build \
            -t atiyadocker/mern-backend:${{github.sha}} \
            -t atiyadocker/mern-backend:latest \
            ./backend
     - name: Publish Frontend image
       run: |
         docker push atiyadocker/mern-frontend:${{github.sha}}
         docker push atiyadocker/mern-frontend:latest
     - name: Publish Backend image
       run: |
         docker push atiyadocker/mern-backend:${{github.sha}}
         docker push atiyadocker/mern-backend:latest




